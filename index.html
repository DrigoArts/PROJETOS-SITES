    #container{
        display: grid;
        grid-template-areas:
        'header header';
        gap: 30px;
    }
    header{
        background-color: rgb(211, 224, 94);
        width: 100%;
        height: 80px;
        position: fixed;
        z-index: 1000;
    }

    #container2{
        background-color: rgb(238, 192, 64);
        display: grid;
        grid-template-areas:
        'aside article'
        'section section'
        'footer footer';
        gap: 30px;
        position: relative;
        top: 100px;
        height: 100vh;
    }
    aside{
        grid-area: aside;
        background-color: lightgray;
    }
    article{
        grid-area: article;
        background-color: lightblue;
    }
    section{
        grid-area: section;
        background-color: lightgreen;
    }
    footer{
        position: fixed;
        bottom: 0;
        grid-area: footer;
        background-color: lightcoral;
        width: 100%;
        height: 80px;
        z-index: 1000;
    }


</style>
</head>
<body>
    <div id="container">
        <header class="header">Header
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </header>
    </div>
    <div id="container2">
        <aside class="aside">Aside</aside>
        <article class="article">Article</article>
        <section class="section">Section</section>
    </div>
