<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">MeuLogo</div>
        <nav class="nav-links" aria-label="Navegação Principal">
            <a href="#">Home</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container-conteudo">
        <div class="conteudo">conteudo</div>
        <div class="conteudo"></div>
        <div class="conteudo"></div>
        <div class="conteudo"></div>
        <div class="conteudo"></div>
    </main>

    <!-- Fundo escuro semitransparente para quando o menu abrir -->
    <div class="overlay" id="overlay"></div>

    <!-- Menu Lateral (Sidebar Mobile) -->
    <aside class="sidebar" id="sidebar" aria-label="Menu Lateral">
        <div class="sidebar-header">
            <span class="sidebar-title">Navegação</span>
            <button type="button" class="btn-close" id="btn-close" aria-label="Fechar Menu">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="#">Home</a>
            <a href="#">Sobre</a>
            <a href="#">Serviços</a>
            <a href="#">Projetos</a>
            <a href="#">Contato</a>
        </nav>
    </aside>

    <!-- Rodapé com Botão Hambúrguer -->
    <footer class="footer">
        <div class="footer-inner">
            <p>&copy; 2026 MeuLogo. Todos os direitos reservados.</p>
            <!-- Botão Hambúrguer -->
            <button type="button" class="btn-hamburger" id="btn-menu" aria-label="Abrir menu mobile">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </footer>

</body>
<script src="js/sidebar.js"></script>
</html>
