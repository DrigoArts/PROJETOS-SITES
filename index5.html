<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  /* =========================================================
     1. ESTILOS GERAIS (Compartilhados por todas as telas)
  ========================================================= */
  #banner {
    width: 100%;
    background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .cards-container {
    display: flex;
    width: 100%;
    box-sizing: border-box;
  }

  .card {
    background-color: #18181b; /* zinc-900 */
    border: 1px solid #27272a; /* zinc-800 */
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    box-sizing: border-box;
  }

  .card-title {
    color: #a1a1aa;
    font-weight: 500;
  }

  .card-value {
    margin: 0;
    font-weight: 700;
  }

  .card-info {
    margin: 0;
    color: #71717a;
  }

  /* Cores temáticas dos valores */
  .card-saldo .card-value { color: #38bdf8; }
  .card-entradas .card-value { color: #34d399; }
  .card-saidas .card-value { color: #f87171; }


  /* =========================================================
     2. @MEDIA PARA DESKTOP (Telas a partir de 769px)
  ========================================================= */
  @media (min-width: 769px) {
    #banner {
      height: 350px;
      border-radius: 30px;
      margin-bottom: 24px;
    }

    .cards-container {
      gap: 16px;
    }

    .card {
      flex: 1; /* Divide as 3 colunas por igual */
      border-radius: 16px;
      padding: 20px;
      gap: 6px;
    }

    .card-title {
      font-size: 13px;
    }

    .card-value {
      font-size: 24px;
    }

    .card-info {
      font-size: 11px;
    }
  }


  /* =========================================================
     3. @MEDIA PARA CELULAR (Telas até 768px)
  ========================================================= */
  @media (max-width: 768px) {
    #banner {
      height: 180px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .cards-container {
      gap: 6px;
      overflow-x: auto; /* Mantém os 3 lado a lado em carrossel deslizável */
      padding-bottom: 8px;
      scrollbar-width: none; /* Esconde barra no Firefox */
    }

    .cards-container::-webkit-scrollbar {
      display: none; /* Esconde barra no Chrome/Safari */
    }

    .card {
      flex: 1;
      min-width: 0;
      border-radius: 12px;
      padding: 10px 6px;
      gap: 2px;
    }

    .card-title {
      font-size: 12px;
    }
    .card-value {
      font-size: 18px;
    }
    .card-info {
      font-size: 10px;
    }
  }
</style>
<body>
    <main>
  <div id="banner"></div>

  <!-- Cards de Saldo, Entradas e Saídas -->
  <div class="cards-container">
    <!-- Card: Saldo -->
    <div class="card card-saldo">
      <span class="card-title">Saldo Total</span>
      <h3 class="card-value">R$ 5.490,00</h3>
      <p class="card-info">Disponível em conta</p>
    </div>

    <!-- Card: Entradas -->
    <div class="card card-entradas">
      <span class="card-title">Entradas / Receitas</span>
      <h3 class="card-value">+ R$ 7.200,00</h3>
      <p class="card-info">Ganhos no período</p>
    </div>

    <!-- Card: Saídas -->
    <div class="card card-saidas">
      <span class="card-title">Saídas / Despesas</span>
      <h3 class="card-value">- R$ 1.710,00</h3>
      <p class="card-info">Gastos no período</p>
    </div>
  </div>
  <button><a href="index3.html">index 3</a></button>
</main>
</body>
</html>
